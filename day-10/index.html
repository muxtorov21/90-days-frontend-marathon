<!DOCTYPE html>
<html lang="uz">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>API</title>
	<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen p-4 sm:p-8">

	<div class="bg-white w-full max-w-md mx-auto p-6 rounded-2xl shadow-xl">
		<div class="flex gap-2 ">
			<p id="advice-text"></p>
		</div>
		<button id="newBtn"
			class="bg-green-600 my-5 hover:bg-pink-700 text-white font-bold py-3 px-6 rounded-xl transition-all active:scale-95">
			New advice
		</button>
		<h1 class="text-2xl font-bold text-gray-800 mb-6 text-center">Vazifalar</h1>

		<div class="flex flex-col sm:flex-row gap-2 mb-6">
			<input type="text" id="todo-value"
				class="flex-1 border border-gray-300 p-3 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 text-lg"
				placeholder="Yangi vazifa...">
			<button id="todo-add"
				class="bg-blue-600 hover:bg-gray-700 text-white font-bold py-3 px-6 rounded-xl transition-all active:scale-95">
				Qo'shish
			</button>
		</div>

		<ul id="todo-list" class="space-y-3"></ul>

		<div>
			<img src="" alt="" class="w-full mx-auto my-5 max-w-[300px]" id="dogImg">
			<button id="new-dog-btn"
				class="bg-yellow-500 my-5 hover:bg-red-700 text-white font-bold py-3 px-6 rounded-xl transition-all active:scale-95">
				New dog
			</button>

			<div>
				<h3 id="owner"></h3>
				<img src="" alt="" id="ownerImg">
				<p id="ownerName"></p>
			</div>

		</div>
	</div>

	<script src="main.js"></script>
</body>

</html>
